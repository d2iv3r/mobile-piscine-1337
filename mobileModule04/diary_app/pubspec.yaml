name: diary_app
description: A diary app with Firebase Authentication and Firestore database.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase core
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Firestore database (needed for ex01, set up now)
  cloud_firestore: ^4.13.6

  # Date formatting
  intl: ^0.19.0

  http: ^1.2.0

  # UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true